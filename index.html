<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Fallback-Title/-Description (nur sichtbar, falls JavaScript nicht
    läuft und das Prerendering aus irgendeinem Grund nicht greift).
    Normalerweise ersetzt scripts/prerender.mjs diesen Block pro Seite
    durch den von react-helmet-async gesetzten, seitenspezifischen
    Title/Description/Canonical/hreflang/JSON-LD (siehe SeoLinks.jsx).
  -->
  <title>PaMaRo Living | Property Care & Interior Design in Dalmatia</title>
  <meta
    name="description"
    content="Property care, interior design and personalised support for holiday homes and properties in Dalmatia, Croatia. Reliable, discreet and locally based."
  />
  <!--app-head-->

  <meta name="author" content="PaMaRo Living" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta property="og:site_name" content="PaMaRo Living" />

  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="de_DE" />
  <meta property="og:locale:alternate" content="hr_HR" />

  <meta
    property="og:title"
    content="PaMaRo Living | Property Care & Interior Design in Dalmatia"
  />

  <meta
    property="og:description"
    content="Reliable property care, home services and interior styling for holiday homes and properties in Dalmatia."
  />

  <meta
    property="og:image"
    content="https://www.pamaroliving.com/og-image.jpg"
  />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PaMaRo Living – property in Dalmatia" />

  <meta
    property="og:url"
    content="https://www.pamaroliving.com"
  />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="PaMaRo Living | Property Care & Interior Design in Dalmatia"
  />

  <meta
    name="twitter:description"
    content="Reliable property care, home services and interior styling in Dalmatia."
  />

  <meta
    name="twitter:image"
    content="https://www.pamaroliving.com/og-image.jpg"
  />

  <meta name="theme-color" content="#f7f2ed" />
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
